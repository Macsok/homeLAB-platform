---
- name: Reload sysctl settings
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true

- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
    enabled: true

- name: Restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    enabled: true
