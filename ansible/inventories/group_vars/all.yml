---
# pkgs.k8s.io publishes a separate repository for every Kubernetes minor version.
kubernetes_minor_version: "v1.36"

kubernetes_pod_network_cidr: "10.244.0.0/16"
kubernetes_service_cidr: "10.96.0.0/12"
kubernetes_cri_socket: "unix:///run/containerd/containerd.sock"

calico_version: "v3.32.1"
calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"

# The base cluster does not require MetalLB. Enable it in inventory or with
# `-e metallb_enabled=true` when LoadBalancer services should receive LAN IPs.
metallb_enabled: false
metallb_version: "v0.16.1"
metallb_manifest_url: "https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml"
metallb_pool_name: "homelab"

kubernetes_readiness_timeout: "600s"

kubernetes_admin_user: "{{ ansible_user }}"
kubernetes_admin_home: "/home/{{ kubernetes_admin_user }}"
