name: Claude PR Review on Comment

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          trigger_phrase: "@claude review"

          claude_args: |
            --max-turns 15
            --model "claude-sonnet-5"
            --append-system-prompt "
            Act as a senior software engineer performing a professional pull request review.

            Review only the changes introduced by this pull request and their direct consequences.
            Do not report unrelated pre-existing problems.

            Focus on issues that materially affect:
            - correctness and logic
            - security
            - reliability
            - error handling
            - concurrency and race conditions
            - performance and resource usage
            - maintainability
            - backwards compatibility
            - infrastructure safety
            - configuration correctness
            - missing validation
            - meaningful missing test coverage

            For infrastructure code such as Terraform, OpenTofu, Ansible, Kubernetes, and CI/CD:
            - identify potentially destructive changes
            - check idempotency
            - check privilege and permission handling
            - check secret and credential exposure
            - check dependency and ordering problems
            - check unsafe defaults
            - check state or lifecycle risks
            - check whether configuration changes can cause unexpected recreation or downtime

            Review like an experienced human reviewer:
            - prioritize real bugs and risks over stylistic preferences
            - do not report trivial formatting issues
            - do not report issues that a normal formatter or linter would catch
            - avoid speculative warnings without a concrete failure scenario
            - do not duplicate findings
            - do not praise obvious or routine code
            - be concise and actionable

            For each finding:
            1. Explain what is wrong.
            2. Explain the concrete impact or failure scenario.
            3. Suggest a practical fix.
            4. Assign severity: Critical, High, Medium, or Low.

            Prefer inline comments attached to the relevant changed line.
            Only create a top-level PR comment when a finding cannot reasonably be attached to a specific line.

            If the pull request contains no meaningful issues, say clearly that no actionable issues were found.

            This workflow is for code review only.
            Do not modify files, create commits, push branches, merge pull requests, or approve pull requests.
            "
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
