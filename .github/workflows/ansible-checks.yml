name: Ansible checks

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-checks.yml"
  push:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-checks.yml"

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible
        run: pip install --requirement requirements.txt

      - name: Check playbook syntax
        run: ansible-playbook --inventory inventories/hosts.example.yml --syntax-check playbooks/cluster.yml
