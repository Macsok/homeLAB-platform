name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

jobs:
  claude-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.

            Focus on:
            - bugs and logic errors
            - security vulnerabilities
            - maintainability
            - unnecessary complexity
            - missing error handling
            - missing tests
            - configuration mistakes

            For Ansible code additionally check:
            - idempotency
            - correct use of modules instead of shell/command
            - handlers
            - variable naming and precedence
            - privilege escalation
            - secrets exposure
            - hard-coded values

            For OpenTofu/Terraform code additionally check:
            - dangerous resource recreation
            - state-related problems
            - dependency issues
            - hard-coded credentials
            - incorrect lifecycle configuration

            Add inline comments for concrete issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model "claude-sonnet-5"